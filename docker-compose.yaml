x-app: &app
  build: .
  restart: always
  init: true
  env_file: .env
  environment:
    DB_DATABASE: /app/storage/app/database.sqlite
  volumes:
    - storage:/app/storage/app

services:
  app:
    <<: *app
    ports:
      - ${APP_PORT:-80}:80
    healthcheck:
      test: curl -fs http://localhost/up
      interval: 10s

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      test: [CMD, pgrep, -f, schedule:work]
      interval: 10s

  queue:
    <<: *app
    command: php artisan queue:work --tries=3
    healthcheck:
      test: [CMD, pgrep, -f, queue:work]
      interval: 10s

volumes:
  storage:
